<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vita2OSC — Companion</title>
<style>
  :root{
    --bg:#14161c; --bar:#22262f; --card:#1b1e26; --accent:#3d9bff;
    --text:#eceff4; --dim:#8a92a6; --ok:#53d769; --warn:#ff9f43; --line:#2c3240;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
  header{background:var(--bar);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0 12px 0 0}
  input,select,button{font:inherit;color:var(--text);background:var(--card);
    border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  input[type=number]{width:88px}
  button{cursor:pointer}
  button.primary{background:var(--accent);color:#04122a;border-color:var(--accent);font-weight:600}
  button.ghost{background:transparent}
  #status{margin-left:auto;color:var(--dim)}
  #status.ok{color:var(--ok)} #status.err{color:var(--warn)}
  .tabs{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap;background:var(--bg);
    position:sticky;top:57px;z-index:4;border-bottom:1px solid var(--line)}
  .tabs button{border-radius:999px;padding:6px 14px;color:var(--dim)}
  .tabs button.active{background:var(--accent);color:#04122a;border-color:var(--accent);font-weight:600}
  main{padding:16px;max-width:1100px;margin:0 auto}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td .addr{width:210px}
  .muted{color:var(--dim)}
  .settings{display:grid;grid-template-columns:180px 1fr;gap:10px 16px;max-width:520px;
    background:var(--card);padding:18px;border-radius:10px;align-items:center}
  .settings label{color:var(--dim)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .hint{color:var(--dim);font-size:12px;margin-top:8px}
  .pill{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
  /* --- Colors tab --- */
  .colors-grid{display:grid;gap:16px}
  .effect-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
  .effect-card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:10px}
  .effect-card h3 .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;
    background:rgba(61,155,255,.15);color:var(--accent)}
  .color-row{display:grid;grid-template-columns:120px 1fr 180px;gap:10px 14px;align-items:center;margin-bottom:8px}
  .color-row label{color:var(--dim);font-size:13px}
  .color-row input[type=range]{width:100%;accent-color:var(--accent)}
  .color-preview{width:100px;height:100px;border-radius:10px;border:2px solid var(--line);
    cursor:pointer;position:relative;overflow:hidden}
  .color-preview input[type=color]{position:absolute;inset:-8px;width:calc(100% + 16px);
    height:calc(100% + 16px);border:none;cursor:pointer;opacity:0}
  .color-preview .swatch{width:100%;height:100%;border-radius:8px}
  .color-main{display:grid;grid-template-columns:auto 1fr;gap:18px;margin-bottom:16px}
  .groups{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .groups h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
  .group-row{display:grid;grid-template-columns:36px 80px 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
  .group-row .toggle{width:36px;height:22px;accent-color:var(--accent)}
  .addr-sm{width:100%;font-size:12px}
  .colors-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .colors-toolbar label{color:var(--dim)}
  .send-status{font-size:12px;color:var(--dim)}
  .send-status.ok{color:var(--ok)}
  .send-status.err{color:var(--warn)}
  .param-val{font-size:11px;color:var(--dim);width:42px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1>Vita2OSC</h1>
  <label class="muted">Vita IP</label>
  <input id="vitaIp" value="192.168.1.50" size="14">
  <label class="muted">:</label>
  <input id="vitaPort" type="number" value="8080" style="width:74px">
  <button class="ghost" onclick="fetchConfig()">Récupérer la config</button>
  <button class="primary" onclick="sendConfig()">Envoyer à la Vita</button>
  <span id="status">non connecté</span>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="row-actions">
    <button class="ghost" onclick="loadPreset('touchdesigner')">Preset TouchDesigner</button>
    <button class="ghost" onclick="loadPreset('resolume')">Preset Resolume</button>
    <button class="ghost" onclick="exportJson()">Exporter JSON</button>
    <label class="ghost" style="border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer">
      Importer JSON <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJson(event)">
    </label>
    <span class="pill" id="count"></span>
  </div>
  <div id="content"></div>
  <p class="hint">Astuce : la Vita affiche son IP dans l'onglet « Reglages ». Elle doit être sur le même Wi-Fi.
     L'envoi applique la config à chaud (pas besoin de redémarrer l'app).</p>
</main>

<script>
const TABS = [
  {id:"buttons",  label:"Boutons",   match:s=>s.startsWith("button.")},
  {id:"sticks",   label:"Sticks",    match:s=>s.startsWith("stick.")},
  {id:"tfront",   label:"Touch Av",  match:s=>s.startsWith("touch.front")},
  {id:"tback",    label:"Touch Ar",  match:s=>s.startsWith("touch.back")},
  {id:"motion",   label:"Mouvement", match:s=>s.startsWith("motion.")},
  {id:"colors",   label:"Colors",    match:_=>false},
  {id:"settings", label:"Reglages",  match:_=>false},
];
let cfg = defaultConfig();
let activeTab = "buttons";

function baseUrl(){ return `http://${val('vitaIp')}:${val('vitaPort')}`; }
function val(id){ return document.getElementById(id).value.trim(); }
function setStatus(msg, cls){ const s=document.getElementById('status'); s.textContent=msg; s.className=cls||''; }

function defaultConfig(){
  return { version:1, target:{ip:"192.168.1.42",port:9000}, globalPrefix:"/vita",
           sendRateHz:60, controls:[], colors:defaultColors() };
}

/* ---------- Colors ---------- */
const COLOR_EFFECTS = [
  {id:"colorize",    name:"Colorize"},
  {id:"dreamy_glow", name:"Dreamy Glow"},
];
const COLOR_PARAMS = [
  {key:"hue",   label:"Hue",   def:0},
  {key:"sat",   label:"Sat",   def:1},
  {key:"bright",label:"Bright",def:0.5},
  {key:"alpha", label:"Alpha", def:1},
];

function defaultColors(){
  const effects = COLOR_EFFECTS.map(ef => ({
    id: ef.id,
    name: ef.name,
    effectAddress: `/vita/color/${ef.id}/active`,
    hue:   {address:`/vita/color/${ef.id}/hue`,   value:0},
    sat:   {address:`/vita/color/${ef.id}/sat`,   value:1},
    bright:{address:`/vita/color/${ef.id}/bright`,value:0.5},
    alpha: {address:`/vita/color/${ef.id}/alpha`, value:1},
    groups: [1,2,3].map(n => ({
      address: `/vita/color/${ef.id}/group/${n}`,
      enabled: true,
    })),
  }));
  return { groupCount:3, autoSend:true, effects };
}

function loadColorsFromStorage(){
  try{
    const k = 'vita2osc_colors_' + val('vitaIp');
    const raw = localStorage.getItem(k);
    if(raw) cfg.colors = normalizeColors(JSON.parse(raw));
  }catch(_){}
}
function saveColorsToStorage(){
  try{
    const k = 'vita2osc_colors_' + val('vitaIp');
    localStorage.setItem(k, JSON.stringify(cfg.colors));
  }catch(_){}
}

function normalizeColors(c){
  if(!c || !Array.isArray(c.effects)) return defaultColors();
  const defs = defaultColors();
  return {
    groupCount: c.groupCount||3,
    autoSend: c.autoSend!==false,
    effects: defs.effects.map(def => {
      const src = c.effects.find(e=>e.id===def.id) || {};
      const fx = {...def, ...src};
      for(const p of COLOR_PARAMS){
        fx[p.key] = {...def[p.key], ...(src[p.key]||{})};
      }
      fx.groups = (src.groups||def.groups).map((g,i)=>({
        address: g.address||def.groups[i]?.address||'',
        enabled: g.enabled!==false,
      }));
      while(fx.groups.length < (c.groupCount||3))
        fx.groups.push({address:`/vita/color/${fx.id}/group/${fx.groups.length+1}`,enabled:true});
      return fx;
    }),
  };
}

function hsbToRgb(h,s,b){
  h=((h%1)+1)%1; const i=Math.floor(h*6), f=h*6-i;
  const p=b*(1-s), q=b*(1-f*s), t=b*(1-(1-f)*s);
  let r,g,bl;
  switch(i%6){
    case 0: r=b;g=t;bl=p; break; case 1: r=q;g=b;bl=p; break;
    case 2: r=p;g=b;bl=t; break; case 3: r=p;g=q;bl=b; break;
    case 4: r=t;g=p;bl=b; break; default: r=b;g=p;bl=q;
  }
  return [Math.round(r*255),Math.round(g*255),Math.round(bl*255)];
}
function rgbToHsb(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0, s=mx?d/mx:0;
  if(d){
    if(mx===r) h=((g-b)/d+(g<b?6:0))/6;
    else if(mx===g) h=((b-r)/d+2)/6;
    else h=((r-g)/d+4)/6;
  }
  return [h,s,mx];
}
function effectSwatch(fx){
  const [r,g,b]=hsbToRgb(fx.hue.value,fx.sat.value,fx.bright.value);
  const a=fx.alpha.value;
  return `rgba(${r},${g},${b},${a})`;
}

let oscSendTimer=null, lastOscStatus='';
async function sendOscMessages(msgs){
  if(!msgs.length) return;
  try{
    const r=await fetch(baseUrl()+'/osc',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:msgs})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    lastOscStatus=`${j.sent||msgs.length} OSC envoyé(s)`;
    setOscStatus(lastOscStatus,'ok');
  }catch(e){
    lastOscStatus='OSC: '+e.message;
    setOscStatus(lastOscStatus,'err');
  }
}
function setOscStatus(msg,cls){
  const el=document.getElementById('oscStatus');
  if(el){ el.textContent=msg; el.className='send-status '+(cls||''); }
}
function scheduleOscSend(msgs){
  if(!cfg.colors?.autoSend) return;
  clearTimeout(oscSendTimer);
  oscSendTimer=setTimeout(()=>sendOscMessages(msgs),40);
}

function buildOscForEffect(fx, includeToggles){
  const msgs=[];
  if(fx.effectAddress) msgs.push({address:fx.effectAddress,value:1});
  for(const p of COLOR_PARAMS){
    const prm=fx[p.key];
    if(prm?.address) msgs.push({address:prm.address,value:prm.value});
  }
  if(includeToggles){
    for(let i=0;i<fx.groups.length;i++){
      const g=fx.groups[i];
      if(g.address) msgs.push({address:g.address,value:g.enabled?1:0});
    }
  }
  return msgs;
}

function applyEffectColor(ei, includeToggles){
  const fx=cfg.colors.effects[ei];
  scheduleOscSend(buildOscForEffect(fx, includeToggles));
  saveColorsToStorage();
}

function applyAllEffects(){
  const msgs=[];
  for(const fx of cfg.colors.effects) msgs.push(...buildOscForEffect(fx, true));
  sendOscMessages(msgs);
  saveColorsToStorage();
}

function setEffectParam(ei, key, value){
  const fx=cfg.colors.effects[ei];
  fx[key].value=Math.max(0,Math.min(1,value));
  if(key==='hue'||key==='sat'||key==='bright'){
    const [r,g,b]=hsbToRgb(fx.hue.value,fx.sat.value,fx.bright.value);
    const hex='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
    fx._hex=hex;
  }
  applyEffectColor(ei, false);
  render();
}

function setEffectFromColor(ei, hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const [h,s,br]=rgbToHsb(r,g,b);
  const fx=cfg.colors.effects[ei];
  fx.hue.value=h; fx.sat.value=s; fx.bright.value=br;
  fx._hex=hex;
  applyEffectColor(ei, false);
  render();
}

function setGroupCount(n){
  n=Math.max(1,Math.min(8,parseInt(n)||3));
  cfg.colors.groupCount=n;
  for(const fx of cfg.colors.effects){
    while(fx.groups.length<n){
      const i=fx.groups.length;
      fx.groups.push({address:`/vita/color/${fx.id}/group/${i+1}`,enabled:true});
    }
    fx.groups.length=n;
  }
  saveColorsToStorage(); render();
}

function colorsHtml(){
  const c=cfg.colors;
  let h=`<div class="colors-toolbar">
    <label>Groupes</label>
    <input type="number" min="1" max="8" value="${c.groupCount}" style="width:56px"
      onchange="setGroupCount(this.value)">
    <label><input type="checkbox" ${c.autoSend?'checked':''}
      onchange="cfg.colors.autoSend=this.checked;saveColorsToStorage()"> Envoi auto OSC</label>
    <button class="primary" onclick="applyAllEffects()">Appliquer à tous les groupes</button>
    <span id="oscStatus" class="send-status">${lastOscStatus}</span>
  </div><div class="colors-grid">`;

  c.effects.forEach((fx,ei)=>{
    const sw=effectSwatch(fx);
    const hex=fx._hex||('#'+hsbToRgb(fx.hue.value,fx.sat.value,fx.bright.value)
      .map(v=>v.toString(16).padStart(2,'0')).join(''));
    h+=`<div class="effect-card">
      <h3>${fx.name} <span class="badge">${fx.id}</span></h3>
      <div class="color-row" style="grid-template-columns:120px 1fr">
        <label>Effet OSC</label>
        <input class="addr-sm" value="${fx.effectAddress||''}"
          onchange="cfg.colors.effects[${ei}].effectAddress=this.value;saveColorsToStorage()">
      </div>
      <div class="color-main">
        <div class="color-preview" title="Sélecteur de teinte">
          <div class="swatch" style="background:${sw}"></div>
          <input type="color" value="${hex}" oninput="setEffectFromColor(${ei},this.value)">
        </div>
        <div>`;
    for(const p of COLOR_PARAMS){
      const prm=fx[p.key];
      h+=`<div class="color-row">
        <label>${p.label}</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="range" min="0" max="1" step="0.001" value="${prm.value}"
            oninput="setEffectParam(${ei},'${p.key}',parseFloat(this.value))">
          <span class="param-val">${prm.value.toFixed(3)}</span>
        </div>
        <input class="addr-sm" value="${prm.address||''}" placeholder="Adresse OSC"
          onchange="cfg.colors.effects[${ei}]['${p.key}'].address=this.value;saveColorsToStorage()">
      </div>`;
    }
    h+=`</div></div>
      <div class="groups"><h4>Groupes — toggle OSC</h4>`;
    fx.groups.forEach((g,gi)=>{
      h+=`<div class="group-row">
        <input type="checkbox" class="toggle" ${g.enabled?'checked':''}
          onchange="cfg.colors.effects[${ei}].groups[${gi}].enabled=this.checked;
            applyEffectColor(${ei},true)">
        <span>Groupe ${gi+1}</span>
        <input class="addr-sm" value="${g.address||''}"
          onchange="cfg.colors.effects[${ei}].groups[${gi}].address=this.value;saveColorsToStorage()">
        <button class="ghost" style="font-size:12px;padding:4px 8px"
          onclick="cfg.colors.effects[${ei}].groups[${gi}].enabled=true;applyEffectColor(${ei},true)">ON</button>
      </div>`;
    });
    h+=`</div></div>`;
  });
  h+='</div>';
  h+=`<p class="hint">L'onglet Colors est aussi disponible sur la Vita (onglet Couleurs) avec contrôle tactile.
     Les couleurs sont envoyées via la Vita (POST /osc ou envoi direct) vers la cible OSC.</p>`;
  return h;
}

/* ---------- rendu ---------- */
function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  for(const tab of TABS){
    const b=document.createElement('button');
    b.textContent=tab.label; b.className=(tab.id===activeTab?'active':'');
    b.onclick=()=>{activeTab=tab.id;render();};
    t.appendChild(b);
  }
}

function render(){
  renderTabs();
  document.getElementById('count').textContent = cfg.controls.length + " contrôles";
  const c=document.getElementById('content');
  if(activeTab==='settings'){ c.innerHTML=settingsHtml(); return; }
  if(activeTab==='colors'){ c.innerHTML=colorsHtml(); return; }
  const tab=TABS.find(t=>t.id===activeTab);
  const rows=cfg.controls.filter(ctl=>tab.match(ctl.source));
  if(!rows.length){ c.innerHTML='<p class="muted">Aucun contrôle pour cet onglet. Charge un preset.</p>'; return; }
  let h='<table><thead><tr>'
    +'<th>On</th><th>Source</th><th>Adresse OSC</th><th>Type</th><th>Min</th><th>Max</th>'
    +'<th>Deadzone</th><th>Lissage</th><th>Inv</th><th>Mode</th><th>Bundle</th></tr></thead><tbody>';
  for(const ctl of rows){
    const i=cfg.controls.indexOf(ctl);
    h+=`<tr>
      <td><input type="checkbox" ${ctl.enabled?'checked':''} onchange="upd(${i},'enabled',this.checked)"></td>
      <td class="muted">${srcLabel(ctl.source)}<br><span class="muted" style="font-size:11px">${ctl.source}</span></td>
      <td><input class="addr" value="${ctl.address||''}" onchange="upd(${i},'address',this.value)"></td>
      <td><select onchange="upd(${i},'typeTag',this.value)">
        <option value="f" ${ctl.typeTag==='f'?'selected':''}>float</option>
        <option value="i" ${ctl.typeTag==='i'?'selected':''}>int</option></select></td>
      <td><input type="number" step="0.01" value="${ctl.min}" onchange="upd(${i},'min',parseFloat(this.value))"></td>
      <td><input type="number" step="0.01" value="${ctl.max}" onchange="upd(${i},'max',parseFloat(this.value))"></td>
      <td><input type="number" step="0.01" value="${ctl.deadzone||0}" onchange="upd(${i},'deadzone',parseFloat(this.value))"></td>
      <td><input type="number" step="0.01" value="${ctl.smoothing||0}" onchange="upd(${i},'smoothing',parseFloat(this.value))"></td>
      <td><input type="checkbox" ${ctl.invert?'checked':''} onchange="upd(${i},'invert',this.checked)"></td>
      <td><select onchange="upd(${i},'mode',this.value)">
        <option value="onChange" ${ctl.mode==='onChange'?'selected':''}>onChange</option>
        <option value="continuous" ${ctl.mode==='continuous'?'selected':''}>continuous</option>
        <option value="trigger" ${ctl.mode==='trigger'?'selected':''}>trigger</option></select></td>
      <td><input type="number" style="width:56px" value="${ctl.bundleGroup||0}" onchange="upd(${i},'bundleGroup',parseInt(this.value)||0)"></td>
    </tr>`;
  }
  h+='</tbody></table>';
  c.innerHTML=h;
}

function settingsHtml(){
  return `<div class="settings">
    <label>Cible IP</label><input value="${cfg.target.ip}" onchange="cfg.target.ip=this.value">
    <label>Cible Port</label><input type="number" value="${cfg.target.port}" onchange="cfg.target.port=parseInt(this.value)||0">
    <label>Préfixe global</label><input value="${cfg.globalPrefix}" onchange="cfg.globalPrefix=this.value">
    <label>Débit (Hz)</label><input type="number" value="${cfg.sendRateHz}" onchange="cfg.sendRateHz=parseInt(this.value)||60">
  </div>
  <p class="hint">Le port cible est celui qu'écoute ton logiciel OSC (TouchDesigner 9000, Resolume 7000…).</p>`;
}

function upd(i,key,v){ cfg.controls[i][key]=v; }

/* ---------- réseau ---------- */
async function fetchConfig(){
  try{
    setStatus('connexion…');
    const r=await fetch(baseUrl()+'/config',{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const savedColors = cfg.colors;
    cfg=normalize(await r.json());
    if(!cfg.colors || !cfg.colors.effects?.length) cfg.colors = savedColors || defaultColors();
    loadColorsFromStorage();
    setStatus('config récupérée','ok'); render();
  }catch(e){ setStatus('échec GET ('+e.message+')','err'); }
}
async function sendConfig(){
  try{
    setStatus('envoi…');
    saveColorsToStorage();
    const r=await fetch(baseUrl()+'/config',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
    if(!r.ok) throw new Error(r.status);
    setStatus('config envoyée ✓ (appliquée à chaud)','ok');
  }catch(e){ setStatus('échec POST ('+e.message+')','err'); }
}

/* ---------- presets / import / export ---------- */
function normalize(c){
  c.target=c.target||{ip:"192.168.1.42",port:9000};
  c.controls=(c.controls||[]).map(x=>({
    source:x.source, enabled:x.enabled!==false, address:x.address||'',
    typeTag:x.typeTag||'f', min:num(x.min,0), max:num(x.max,1),
    deadzone:num(x.deadzone,0), smoothing:num(x.smoothing,0),
    invert:!!x.invert, mode:x.mode||'onChange', bundleGroup:x.bundleGroup||0
  }));
  c.colors=normalizeColors(c.colors);
  return c;
}
function num(v,d){ return (typeof v==='number'&&!isNaN(v))?v:d; }

function exportJson(){
  const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='vita2osc_config.json'; a.click();
}
function importJson(ev){
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ cfg=normalize(JSON.parse(rd.result)); render(); setStatus('JSON importé','ok'); }
                  catch(e){ setStatus('JSON invalide','err'); } };
  rd.readAsText(f);
}

function loadPreset(kind){
  const savedColors = cfg.colors;
  const buttons=["cross","circle","square","triangle","up","down","left","right","l","r","start","select"];
  const td = kind==='touchdesigner';
  const c=defaultConfig();
  c.target.port = td?9000:7000;
  c.sendRateHz  = td?60:30;
  const btnMode = td?'onChange':'trigger';
  buttons.forEach(b=>c.controls.push(mk(`button.${b}`,`/vita/pad/${b}`,'f',0,1,0,0,false,btnMode,0)));
  const sMin=td?-1:0, sMax=1;
  c.controls.push(mk("stick.left.x","/vita/stick/lx",'f',sMin,sMax,0.08,td?0:0.05,false,'continuous',0));
  c.controls.push(mk("stick.left.y","/vita/stick/ly",'f',sMin,sMax,0.08,td?0:0.05,true,'continuous',0));
  c.controls.push(mk("stick.right.x","/vita/stick/rx",'f',sMin,sMax,0.08,td?0:0.05,false,'continuous',0));
  c.controls.push(mk("stick.right.y","/vita/stick/ry",'f',sMin,sMax,0.08,td?0:0.05,true,'continuous',0));
  const bg=td?1:0;
  c.controls.push(mk("touch.front.0.x","/vita/touch/front/0/x",'f',0,1,0,0,false,'continuous',bg));
  c.controls.push(mk("touch.front.0.y","/vita/touch/front/0/y",'f',0,1,0,0,td?false:true,'continuous',bg));
  c.controls.push(mk("touch.front.0.z","/vita/touch/front/0/z",'f',0,1,0,0,false,'continuous',bg));
  c.controls.push(mk("touch.back.0.x","/vita/touch/back/0/x",'f',0,1,0,0,false,'continuous',td?3:0));
  c.controls.push(mk("touch.back.0.y","/vita/touch/back/0/y",'f',0,1,0,0,td?false:true,'continuous',td?3:0));
  const mMin=td?-2:0;
  c.controls.push(mk("motion.accel.x","/vita/accel/x",'f',mMin,td?2:1,0,td?0.1:0.15,false,'continuous',0));
  c.controls.push(mk("motion.accel.y","/vita/accel/y",'f',mMin,td?2:1,0,td?0.1:0.15,false,'continuous',0));
  c.controls.push(mk("motion.accel.z","/vita/accel/z",'f',mMin,td?2:1,0,td?0.1:0.15,false,'continuous',0));
  if(td){
    c.controls.push(mk("motion.gyro.x","/vita/gyro/x",'f',-5,5,0,0.1,false,'continuous',0));
    c.controls.push(mk("motion.gyro.y","/vita/gyro/y",'f',-5,5,0,0.1,false,'continuous',0));
    c.controls.push(mk("motion.gyro.z","/vita/gyro/z",'f',-5,5,0,0.1,false,'continuous',0));
  }
  c.controls.push(mk("motion.orientation.roll", "/vita/orient/roll", 'f',td?-1:0,1,0,td?0.15:0.2,false,'continuous',0));
  c.controls.push(mk("motion.orientation.pitch","/vita/orient/pitch",'f',td?-1:0,1,0,td?0.15:0.2,false,'continuous',0));
  c.controls.push(mk("motion.orientation.yaw",  "/vita/orient/yaw",  'f',td?-1:0,1,0,td?0.15:0.2,false,'continuous',0));
  cfg=c;
  cfg.colors = savedColors || defaultColors();
  render(); setStatus('preset '+kind+' chargé','ok');
}
function mk(source,address,typeTag,min,max,deadzone,smoothing,invert,mode,bundleGroup){
  return {source,enabled:true,address,typeTag,min,max,deadzone,smoothing,invert,mode,bundleGroup};
}

function srcLabel(s){
  const m={
    "button.cross":"Croix","button.circle":"Rond","button.square":"Carré","button.triangle":"Triangle",
    "button.up":"Haut","button.down":"Bas","button.left":"Gauche","button.right":"Droite",
    "button.l":"L","button.r":"R","button.start":"Start","button.select":"Select",
    "stick.left.x":"Stick G X","stick.left.y":"Stick G Y","stick.right.x":"Stick D X","stick.right.y":"Stick D Y",
    "touch.front.0.x":"Touch Av0 X","touch.front.0.y":"Touch Av0 Y","touch.front.0.z":"Touch Av0 P",
    "touch.front.1.x":"Touch Av1 X","touch.front.1.y":"Touch Av1 Y","touch.front.1.z":"Touch Av1 P",
    "touch.back.0.x":"Touch Ar0 X","touch.back.0.y":"Touch Ar0 Y",
    "motion.accel.x":"Accel X","motion.accel.y":"Accel Y","motion.accel.z":"Accel Z",
    "motion.gyro.x":"Gyro X","motion.gyro.y":"Gyro Y","motion.gyro.z":"Gyro Z",
    "motion.orientation.roll":"Roll","motion.orientation.pitch":"Pitch","motion.orientation.yaw":"Yaw",
  };

/* init : charge le preset TouchDesigner par défaut pour montrer l'UI */
loadPreset('touchdesigner');
loadColorsFromStorage();
</script>
